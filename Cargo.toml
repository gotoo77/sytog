[workspace]
resolver = "2"
members = [
    "crates/sytog-domain",
    "crates/sytog-protocol",
    "crates/sytog-runtime",
    "crates/sytog-demo-counter",
    "crates/sytog-demo-vote",
    "crates/sytog-capabilities",
    "crates/sytog-cli",
    "crates/sytog-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
